<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
  </head>
  <body>
    <!-- {% csrf_token %}  sirve para evitar ataques CSRF que son ataques de codigo malicioso -->
    <form action="/contacto/" method="post">{% csrf_token %}
      <p>Asunto<input type="text" name="asunto" id="" /></p>
      <p>Mensaje<textarea name="mensaje" id="" cols="30" rows="10" ></textarea/></p>
      <input type="submit" value="Enviar" />
    </form>
  </body>
</html>
